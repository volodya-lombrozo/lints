---
# yamllint disable rule:line-length
name: mvn
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  mvn:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        java: [23]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk-${{ matrix.java }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-jdk-${{ matrix.java }}-maven-
      - uses: JesseTG/rm@v1.0.3
        with:
          path: ~/.m2/repository/org/eolang
      - run: mvn clean install -ntp -PskipITs --errors --batch-mode
      - run: mvn test --errors --batch-mode
  telegram:
    needs: mvn
    runs-on: ubuntu-24.04
    if: ${{ failure() && github.ref == 'refs/heads/master' }}
    steps:
      - uses: appleboy/telegram-action@master
        with:
          to: -1004371404002
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "⚠️ Maven build of ${{ github.repository }} [failed](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          disable_web_page_preview: true
          format: markdown
  recovered:
    needs: mvn
    runs-on: ubuntu-24.04
    if: ${{ success() && github.ref == 'refs/heads/master' }}
    permissions:
      actions: read
    steps:
      - id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          latest() {
            gh api "/repos/${{ github.repository }}/actions/workflows/mvn.yml/runs?branch=${{ github.ref_name }}&status=$1&per_page=1" \
              --jq '[ .workflow_runs[] | select(.id != ${{ github.run_id }}) | .id ][0] // 0'
          }
          if [ "$(latest failure)" -gt "$(latest success)" ]; then
            echo 'broken=yes' >> "${GITHUB_OUTPUT}"
          fi
      - if: ${{ steps.previous.outputs.broken == 'yes' }}
        uses: appleboy/telegram-action@master
        with:
          to: -1004371404002
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "👍🏻 Maven build of ${{ github.repository }} [recovered](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          disable_web_page_preview: true
          format: markdown
