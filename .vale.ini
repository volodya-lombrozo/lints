StylesPath = .github/styles
Vocab = Custom
MinAlertLevel = suggestion
; Pinned to specific releases so CI doesn't break when upstream style
; packages silently add or tighten rules (see #1180).
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.0/Google.zip, https://github.com/errata-ai/Microsoft/releases/download/v0.15.0/Microsoft.zip, https://github.com/errata-ai/proselint/releases/download/v0.3.4/proselint.zip

[*.md]
;; @todo #540:60min Add a new style package - `write-good` - to both this list and the package list.
;; Then fix all the issues it reports(there will be a lot).
;; It’s better to run Vale locally to find issues,
;; since the GitHub Action outputs the list in a less readable format when there are many errors.
;; format due to the large number of errors.
BasedOnStyles = Vale, Google, Microsoft, proselint

Microsoft.Passive = No
Google.Passive = No
Microsoft.We = No
Google.We = No
Google.Will = No
Microsoft.Vocab = No
Google.Parens = No
Google.Headings = No
Microsoft.Headings = No
Microsoft.Contractions = No
Google.Contractions = No

[src/main/resources/org/eolang/motives/atoms/not-empty-atom.md]
Google.Units = No
