---
sheets:
  - /org/eolang/lints/tests/wrong-test-order.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[@line='2']
ignore-schema: true
document: |
  <object author="tests">
    <o line="1" name="x">
      <o line="2" name="+runs-x"/>
      <o line="3" name="bool"/>
      <o line="4" name="t"/>
    </o>
  </object>
