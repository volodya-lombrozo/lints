---
sheets:
  - /org/eolang/lints/aliases/alias-too-long.xsl
asserts:
  - /defects[count(defect[@severity='error'])=0]
input: |
  # Foo.

  +alias
  +alias a
  +alias a b
  +alias a b.c.d.e

  [] > foo
