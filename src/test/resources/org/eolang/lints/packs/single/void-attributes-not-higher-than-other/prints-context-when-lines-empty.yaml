---
sheets:
  - /org/eolang/lints/critical/void-attributes-not-higher-than-other.xsl
asserts:
  - /defects[count(defect[@context and @severity='critical'])=1]
xml-reason: "a non-void attribute preceding a void one is a parser error (R-3.4.9); no valid EO source can produce this ordering"
document: |
  <object author="tests">
    <o name="foo">
      <o base="∅" name="x"/>
      <o base="Φ.foo" name="z"/>
      <o base="∅" name="y"/>
    </o>
  </object>
