---
sheets:
  - /org/eolang/lints/metas/package-contains-multiple-parts.xsl
asserts:
  - /defects[count(defect[@severity='critical'])=2]
  - /defects/defect[@line='8']
  - /defects/defect[@line='9']
input: |
  +package test
  +package test.
  +package test.x
  +package привет.foo
  +package org.eolang
  +package my.awesome.package
  +package test.xy
  +package hello world
  +package привет, как дела?

  [] > foo
